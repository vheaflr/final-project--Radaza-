<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueLess Campus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Campus Offices</h1>
    <p>Select an office to view its live queue details.</p>
  </header>

  <main>
    <section aria-label="Campus office list">
      <div id="office-list" class="office-grid"></div>
    </section>

    <section id="queue-details" class="details-panel" hidden>
      <h2 id="detail-office-name">Office Name</h2>
      <p id="detail-queue-info">Select an office above to see queue status.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
